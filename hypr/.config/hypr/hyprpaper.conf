# Empty `monitor` = fallback for every output, including ones hotplugged
# later, so no per-monitor blocks or hotplug scripts are needed.
# quickshell's ColorQuantizer reads the `path` below for the bar accent.

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/pexels-evgeny-tchebotarev-1058775-2187605.jpg
    fit_mode = cover
}

splash = false
ipc = true
