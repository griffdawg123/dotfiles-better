
################
### EXTERNAL ###
################

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/keybinds.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# Physical desk order, left to right: GL2480 (DP-10) | GL2580 (DP-9) | laptop (eDP-1).
# GL2580 (DP-9) is the primary/middle screen -- see the workspace + exec-once
# rules below. These are harmless no-ops when a given monitor isn't connected,
# so this same config covers laptop-only and fully-docked.
monitor = DP-10, preferred, 0x0, 1
monitor = DP-9, preferred, 1920x0, 1
monitor = eDP-1, preferred, 3840x0, 1
# Catch-all for any other/unknown monitor (e.g. a different dock), appended to the right.
monitor = ,preferred, auto-right, 1

#################
### AUTOSTART ###
#################

# Propagate the Wayland session env to dbus/systemd so portals (file dialogs,
# screencast, dark-mode/Settings) activate with the correct environment.
exec-once = dbus-update-activation-environment --systemd --all

# exec-once = waybar &
exec-once = quickshell
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/wallpaper-sync.sh
exec-once = ~/.config/hypr/scripts/monitor-watch.sh
exec-once = hyprctl dispatch focusmonitor DP-9
exec-once = swaync
exec-once = hypridle
exec-once = blueman-applet &
exec-once = swayosd-server &

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,22
env = HYPRCURSOR_SIZE,22

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(87afafff) rgba(87d7afff) 45deg
    col.inactive_border = rgba(303030ff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
      enabled = true
      range = 14
      render_power = 3
      color = rgba(0a0a0aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true # Kills the "bundled with anime girls" splash text too.
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

  touchpad {
    natural_scroll = true
    disable_while_typing = false
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

ecosystem {
  no_update_news = true
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrule = match:class .*, suppress_event maximize
windowrule = match:title ^(rofi), border_size 0
windowrule = match:title ^(rofi), float on
windowrule = match:title ^(rofi), no_shadow on
windowrule = match:title ^(rofi), no_blur on
windowrule = match:title ^(Picture-in-Picture), float on
windowrule = match:title ^(Picture-in-Picture), pin on

windowrule = match:class ^(llm)$, float on
windowrule = match:class ^(llm)$, size 800 600
windowrule = match:class ^(llm)$, center on
windowrule = match:class ^(llm)$, stay_focused on

windowrule = match:class ^(bluetuith)$, float on
windowrule = match:class ^(bluetuith)$, size 720 460
windowrule = match:class ^(bluetuith)$, center on
windowrule = match:class ^(bluetuith)$, stay_focused on

# Pin workspaces 1-9 to a monitor by desk position: 1-3 left (DP-10),
# 4-6 middle (DP-9, primary -- see exec-once below), 7-9 right (eDP-1,
# laptop). $mainMod+[1-9] (keybinds.conf) already switches by number, so
# this just makes those numbers land on the matching physical screen.
# If a named monitor isn't connected (e.g. laptop-only), Hyprland ignores
# the binding and the workspace opens on whatever monitor is active instead
# -- nothing breaks, you just don't get the 3-way split.
# persistent:true keeps each workspace alive (and pinned) even while empty,
# so the 1-2-3/4-5-6/7-8-9 grid stays put instead of workspaces vanishing
# and losing their monitor as soon as you leave them.
workspace = 1, monitor:DP-10, default:true, persistent:true
workspace = 2, monitor:DP-10, persistent:true
workspace = 3, monitor:DP-10, persistent:true
workspace = 4, monitor:DP-9, default:true, persistent:true
workspace = 5, monitor:DP-9, persistent:true
workspace = 6, monitor:DP-9, persistent:true
workspace = 7, monitor:eDP-1, default:true, persistent:true
workspace = 8, monitor:eDP-1, persistent:true
workspace = 9, monitor:eDP-1, persistent:true

# Quickshell floating windows
windowrule = match:class quickshell, float on
