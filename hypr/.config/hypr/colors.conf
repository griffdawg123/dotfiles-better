# Zen palette — muted 256-colour analogues (matches p10k + tmux)
# colour109=#87afaf  colour115=#87d7af  colour102=#878787
# colour108=#87af87  colour174=#d78787  colour179=#d7af5f
# colour236=#303030  colour237=#3a3a3a  colour238=#444444
#
# Canonical source of truth: ~/.config/zen/zen.sh  (shell-export format)
# Quickshell mirror        : ~/.config/quickshell/Theme.qml
# Alacritty mirror         : ~/.config/alacritty/zen-colors.toml

$MAIN    = rgba(1c1c1cee)   # near-black background
$ACCENT1 = rgba(87afafee)   # slate-teal  (colour109) - primary accent
$ACCENT2 = rgba(87d7afee)   # seafoam     (colour115) - secondary accent
$DARK    = rgba(303030ff)   # surface     (colour236)
$LIGHT   = rgba(878787ff)   # muted gray  (colour102)

$FOREGROUND          = rgba(87afafff)   # active border  → slate-teal
$BACKGROUND          = rgba(303030ff)   # inactive border → surface
$CURSORCOLOR         = rgba(878787ff)   # dim gray
$SELECTIONBACKGROUND = rgba(3a3a3aff)   # overlay (colour237)

$BLACK        = rgba(444444ff)   # colour238 - separator gray
$RED          = rgba(d78787ff)   # colour174 - dusty rose
$GREEN        = rgba(87af87ff)   # colour108 - sage
$YELLOW       = rgba(d7af5fff)   # colour179 - amber
$BLUE         = rgba(87afafff)   # colour109 - slate-teal
$PURPLE       = rgba(87d7afff)   # colour115 - seafoam (no purple in zen)
$CYAN         = rgba(87d7afff)   # colour115 - seafoam
$WHITE        = rgba(878787ff)   # colour102 - muted gray

$BRIGHTBLACK  = rgba(444444ff)
$BRIGHTRED    = rgba(d78787ff)
$BRIGHTGREEN  = rgba(87d7afff)
$BRIGHTYELLOW = rgba(d7af5fff)
$BRIGHTBLUE   = rgba(87afafff)
$BRIGHTPURPLE = rgba(87d7afff)
$BRIGHTCYAN   = rgba(87d7afff)
$BRIGHTWHITE  = rgba(878787ff)
