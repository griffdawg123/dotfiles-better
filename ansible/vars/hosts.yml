# hostname -> profile. A profile is vars/profiles/<name>.yml and, for
# machines running Hyprland, hypr/.config/hypr/hosts/<name>/.
#
# Unlisted machine? Run once with `./bootstrap.sh <profile>` and add it here.
host_profiles:
  griff-linux-desktop: desktop
  archlinux: laptop         # Arch default hostname — consider a unique one
  work-wsl: work             # set via /etc/wsl.conf, see README
