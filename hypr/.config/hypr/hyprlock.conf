general {
  enable_fingerprint = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/pexels-evgeny-tchebotarev-1058775-2187605.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.75
    brightness = 0.70
    vibrancy = 0.20
    vibrancy_darkness = 0.0
}

# ── Time ──────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(135, 175, 175, 0.92)
    font_size = 88
    font_family = 0xProto Nerd Font Mono Bold
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 160
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date "+%A  %-d %B"
    color = rgba(135, 175, 175, 0.50)
    font_size = 18
    font_family = 0xProto Nerd Font Mono
    position = 0, 78
    halign = center
    valign = center
}

# ── User ──────────────────────────────────────────────────────────────────────
label {
    monitor =
    text =  $USER
    color = rgba(135, 215, 175, 0.60)
    font_size = 13
    font_family = 0xProto Nerd Font Mono
    position = 0, 14
    halign = center
    valign = center
}

# ── Password field ────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
    dots_fade_time = 180
    outer_color = rgba(135, 175, 175, 0.65)
    inner_color = rgba(28, 28, 28, 0.88)
    font_color = rgba(135, 175, 175, 1.0)
    font_family = 0xProto Nerd Font Mono
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##87afaf55">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(135, 215, 175, 1.0)
    fail_color = rgba(215, 135, 135, 1.0)
    fail_text = <span foreground="##d78787bb"><i>$FAIL ($ATTEMPTS)</i></span>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgba(215, 175, 95, 1.0)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -62
    halign = center
    valign = center
}
