unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

# Pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Intuitive splits — opens in current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set-option -g status-position top

# ── Status bar ────────────────────────────────────────────────────────────────
# Transparent background, p10k zen palette (102=dim, 109=slate, 115=teal, 238=border)

set -g status-style          "bg=default,fg=colour102"
set -g status-left-length    40
set -g status-right-length   80

# Left: session name in muted slate
set -g status-left  "#[fg=colour109,bold] #S #[fg=colour238,nobold]│ "

# Right: cwd │ HH:MM DD/MM/YY
set -g status-right "#[fg=colour102]#{b:pane_current_path}  #[fg=colour238]│  #[fg=colour102]%H:%M  %d/%m/%y  "

# ── Window tabs ───────────────────────────────────────────────────────────────
# Inactive: plain dim text
set -g window-status-format         "  #[fg=colour238]#I #[fg=colour102]#W  "

# Active: rounded Nerd Font caps () around a subtle surface background
# Left cap  in colour236 on transparent → surface bg → number (slate) name (teal) → right cap
set -g window-status-current-format "#[fg=colour236,bg=default]#[bg=colour236,fg=colour109] #I #[fg=colour115]#W #[fg=colour236,bg=default] "

set -g window-status-separator      ""
set -g window-status-style          "bg=default"
set -g window-status-current-style  "bg=default"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=colour236"   # barely visible
set -g pane-active-border-style "fg=colour109"   # muted slate, matches session color

# ── Messages / copy mode ──────────────────────────────────────────────────────
set -g message-style         "bg=default,fg=colour108"
set -g message-command-style "bg=default,fg=colour102"
set -g mode-style            "bg=colour237,fg=colour115"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'jimeh/tmuxifier'

run '~/.tmux/plugins/tpm/tpm'
