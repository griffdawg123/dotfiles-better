####################
### KEYBINDINGS  ###
####################

# Programs
# $browser = firefox
$browser = zen-browser
# $terminal = ghostty
$terminal = alacritty
# $menu = ~/.config/rofi/launchers/type-3/launcher.sh
# $menu = wofi --show run
$menu = fuzzel
# $statusbar = waybar
$statusbar = quickshell
$statusbarlauncher = quickshell -p ~/.config/quickshell/shell.qml
# $statusbarlauncher = ~/.config/$statusbar/launch.sh
$power = ~/.config/rofi/powermenu/type-2/powermenu.sh
# $emojipicker = rofimoji --selector-args="-theme ~/.config/rofi/emoji-picker/theme.rasi"
$emojipicker = BEMOJI_PICKER_CMD="fuzzel -d" bemoji -t 
$gamelauncher = rofi -modi games -show games -theme games-default
$bluetooth = bzmenu --launcher fuzzel
$volume = pavucontrol
$hypridletool = ~/.config/waybar/scripts/idle_toggle.sh --toggle
$llm = alacritty --class llm -e aichat

# $browser = ~/.config/hypr/scripts/fuzzel-search.sh
# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Space, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, $emojipicker
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, W, exec, $statusbarlauncher && hyprctl reload
bind = $mainMod SHIFT, W, exec, killall $statusbar && hyprctl keyword general:gaps_out 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, X, exec, $power
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only
bind = $mainMod, PRINT, exec, hyprshot -m window --clipboard-only
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m output --clipboard-only
bind = $mainMod, G, exec, $gamelauncher
bind = $mainMod SHIFT, B, exec, $bluetooth
bind = $mainMod SHIFT, V, exec, $volume
bind = $mainMod, Z, exec, $hypridletool
bind = $mainMod, C, exec, $llm



# Move focus with mainMod + arrow keys
bind = $mainMod ALT, left, movefocus, l
bind = $mainMod ALT, right, movefocus, r
bind = $mainMod ALT, up, movefocus, u
bind = $mainMod ALT, down, movefocus, d

bind = $mainMod ALT, H, movefocus, l
bind = $mainMod ALT, L, movefocus, r
bind = $mainMod ALT, K, movefocus, u
bind = $mainMod ALT, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move between workspaces
bind = $mainMod, left, workspace, -1
bind = $mainMod, right, workspace, +1

bind = $mainMod, H, workspace, -1
bind = $mainMod, L, workspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move windows around the current workspace
bind = $mainMod CTRL, right, movewindow, r 
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, up, movewindow, u 
bind = $mainMod CTRL, down, movewindow, d

bind = $mainMod CTRL, H, movewindow, r 
bind = $mainMod CTRL, L, movewindow, l
bind = $mainMod CTRL, K, movewindow, u 
bind = $mainMod CTRL, J, movewindow, d

# Move windows to different workspaces
bind = $mainMod SHIFT, left, movetoworkspace, -1
bind = $mainMod SHIFT, right, movetoworkspace, +1

bind = $mainMod SHIFT, H, movetoworkspace, -1
bind = $mainMod SHIFT, L, movetoworkspace, +1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Switch to last active window
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio Control
bindel=, XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise; qs ipc call volume volumeUpdate
bindel=, XF86AudioLowerVolume, exec, swayosd-client --output-volume lower; qs ipc call volume volumeUpdate
bindel=, XF86AudioMute, exec, swayosd-client --output-volume mute-toggle; qs ipc call volume volumeUpdate

# Capslock (If you don't want to use the backend)
bindel=, --release Caps_Lock, exec, swayosd-client --caps-lock

# Brightness raise
bindel=, XF86MonBrightnessUp, exec, swayosd-client --brightness raise; qs ipc call brightness brightnessUpdate
# Brightness lower
bindel=, XF86MonBrightnessDown, exec, swayosd-client --brightness lower; qs ipc call brightness brightnessUpdate
