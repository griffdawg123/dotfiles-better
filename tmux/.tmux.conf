set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on

unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

# Pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Intuitive splits — opens in current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set-option -g status-position top

# ── Status bar ────────────────────────────────────────────────────────────────
# Transparent background, p10k zen palette (102=dim, 109=slate, 115=teal, 238=border)

set -g status-style          "bg=default,fg=colour102"
set -g status-left-length    40
set -g status-right-length   80

# Left: session name in muted slate
set -g status-left  "#[fg=colour109,bold] #S #[fg=colour238,nobold]│ "

# Right: cwd │ HH:MM DD/MM/YY
set -g status-right "#[fg=colour102]#{b:pane_current_path}  #[fg=colour238]│  #[fg=colour102]%H:%M  %d/%m/%y  "

# ── Window tabs ───────────────────────────────────────────────────────────────
# Inactive: plain dim text
set -g window-status-format         "  #[fg=colour238]#I #[fg=colour102]#W  "

# Active: rounded Nerd Font caps () around a subtle surface background
# Left cap  in colour236 on transparent → surface bg → number (slate) name (teal) → right cap
set -g window-status-current-format "#[fg=colour236,bg=default]#[bg=colour236,fg=colour109] #I #[fg=colour115]#W #[fg=colour236,bg=default] "

set -g window-status-separator      ""
set -g window-status-style          "bg=default"
set -g window-status-current-style  "bg=default"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=colour236"   # barely visible
set -g pane-active-border-style "fg=colour109"   # muted slate, matches session color

# ── Messages / copy mode ──────────────────────────────────────────────────────
set -g message-style         "bg=default,fg=colour108"
set -g message-command-style "bg=default,fg=colour102"
set -g mode-style            "bg=colour237,fg=colour115"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'jimeh/tmuxifier'

run '~/.tmux/plugins/tpm/tpm'
